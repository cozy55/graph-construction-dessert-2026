[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dessert2026-dhgraph"
version = "1.0.0"
description = "Typed temporal graph construction for the DESSERT 2026 authentication and network-flow experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Oleksandr Martsenkov"},
  {name = "Oleg Savenko"},
]
dependencies = [
  "pandas==3.0.3",
  "numpy==2.4.6",
  "psutil==7.2.2",
  "scikit-learn==1.9.0",
  "networkx==3.6.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
